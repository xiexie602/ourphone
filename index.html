<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我们的小手机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
.phone{width:100%;max-width:420px;height:100vh;background:#111;display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:480px){.phone{max-height:880px;border-radius:46px;border:10px solid #000;box-shadow:0 0 80px rgba(0,0,0,.9)}}
/* 状态栏 */
.statusbar{height:46px;display:flex;justify-content:space-between;align-items:center;padding:10px 22px 0;color:#9a9a9a;font-size:13px;position:absolute;top:0;left:0;right:0;z-index:30;pointer-events:none}
/* 页面容器 */
.page{position:absolute;inset:0;display:none;flex-direction:column;background:linear-gradient(165deg,#1b1b1e 0%,#131315 100%)}
.page.active{display:flex}
/* 锁屏 */
#lockPage{justify-content:center;align-items:center;gap:18px;background:linear-gradient(180deg,#161618,#0c0c0e);padding-top:50px}
.lock-logo{color:#e8e8e8;font-size:22px;letter-spacing:3px;font-weight:600}
.lock-logo span{color:#d9a066}
.lock-time{color:#fff;font-size:56px;font-weight:200;letter-spacing:4px;margin-top:10px}
.lock-date{color:#888;font-size:14px}
.lock-input{width:220px;padding:13px 16px;background:#1e1e22;border:1px solid #333;border-radius:14px;color:#fff;text-align:center;font-size:20px;letter-spacing:10px;outline:none}
.lock-input:focus{border-color:#d9a066}
.lock-msg{color:#e07070;font-size:12px;height:16px}
.lock-btn{background:#3a3a3f;border:none;color:#eee;padding:10px 34px;border-radius:22px;font-size:14px;cursor:pointer}
.lock-hint{color:#666;font-size:12px}
/* 桌面 */
#homePage .desktop{flex:1;padding:64px 20px 70px;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#242428 0%,#131315 70%)}
.home-greet{color:#cfcfcf;font-size:16px;margin-bottom:4px}
.home-greet b{color:#d9a066}
.home-date{color:#777;font-size:12px;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 12px;justify-items:center}
.icon{width:64px;height:64px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(160deg,#2a2a2e,#1d1d20);border:1px solid #333;cursor:pointer;transition:transform .12s}
.icon:active{transform:scale(.92)}
.icon .emoji{font-size:30px;line-height:1}
.icon .name{color:#bbb;font-size:11px}
.icon.warm{background:linear-gradient(160deg,#3a2f26,#2a201a);border-color:#5a4534}
.icon.warm .name{color:#d9b48f}
/* 应用通用 */
.appbar{height:52px;display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:1px solid #2a2a2e;flex-shrink:0}
.back{background:none;border:none;color:#d9a066;font-size:14px;cursor:pointer;padding:6px 10px;border-radius:10px}
.back:active{background:#222}
.appbar .title{color:#e8e8e8;font-size:16px;font-weight:600;flex:1;text-align:center;margin-right:50px}
.appbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.appbody::-webkit-scrollbar{display:none}
/* 输入框与按钮 */
.inputrow{display:flex;gap:8px}
.inputrow input,.appbody input[type=text],.appbody textarea{flex:1;background:#1e1e22;border:1px solid #333;border-radius:12px;color:#e8e8e8;padding:12px 14px;font-size:14px;outline:none}
.appbody textarea{resize:none;min-height:80px;line-height:1.6}
.btn{background:#3a3a3f;border:none;color:#eee;padding:11px 18px;border-radius:12px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:active{background:#4a4a50}
.btn.warm{background:#b97a4a;color:#fff}
/* 留言条（暖色） */
#notesPage .appbody{background:#f7f0e3}
#notesPage .appbar{background:#f7f0e3;border-bottom:1px solid #e5d8c0}
#notesPage .title{color:#8a5a30}
#notesPage .back{color:#8a5a30}
.note{background:#fff9ec;border:1px solid #e8d9b8;border-left:4px solid #d9a066;border-radius:12px;padding:12px 14px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.note .ntime{color:#b08a5e;font-size:11px;margin-bottom:4px}
.note .ntext{color:#4a3a28;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
/* 日记（暖色） */
#diaryPage .appbody{background:#faf6ec}
#diaryPage .appbar{background:#faf6ec;border-bottom:1px solid #e8dfc8}
#diaryPage .title{color:#7a6a3a}
#diaryPage .back{color:#7a6a3a}
.diary-card{background:#fffdf5;border:1px solid #e8dfc0;border-radius:12px;padding:12px 14px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.diary-card .dtitle{color:#5a4a28;font-size:15px;font-weight:600;margin-bottom:4px}
.diary-card .dtime{color:#a09068;font-size:11px;margin-bottom:6px}
.diary-card .dbody{color:#6a5a38;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
/* 视频/相册/音乐 列表 */
.item{background:#1e1e22;border:1px solid #333;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .ititle{color:#d8d8d8;font-size:13px;flex:1;word-break:break-all}
.item .idel{background:none;border:none;color:#e07070;font-size:16px;cursor:pointer;padding:4px 8px}
.video-wrap video{width:100%;border-radius:12px;background:#000}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid #333}
/* 时钟 */
.clock-big{color:#fff;font-size:64px;font-weight:200;text-align:center;letter-spacing:4px;margin-top:40px}
.clock-date{color:#999;text-align:center;font-size:14px;margin-top:8px}
.anniversary{background:#1e1e22;border:1px solid #333;border-radius:14px;padding:16px;text-align:center;margin-top:26px}
.anniversary .aname{color:#d9a066;font-size:14px;margin-bottom:6px}
.anniversary .anum{color:#fff;font-size:34px;font-weight:200}
.anniversary .aunit{color:#888;font-size:12px}
/* 设置 */
.set-row{display:flex;justify-content:space-between;align-items:center;background:#1e1e22;border:1px solid #333;border-radius:12px;padding:14px 16px}
.set-row .sname{color:#ddd;font-size:14px}
.set-row .sval{color:#888;font-size:12px}
.set-row button{background:#3a3a3f;border:none;color:#eee;padding:8px 14px;border-radius:10px;font-size:12px;cursor:pointer}
.danger{color:#e07070}
.hidden{display:none!important}
.small{font-size:12px;color:#777}
.empty{color:#666;text-align:center;font-size:13px;padding:30px 0}
</style>
</head>
<body>
<div class="phone" id="phone">

  <!-- 状态栏 -->
  <div class="statusbar"><span id="sbTime">--:--</span><span>📶 ▮▮▮▮ 🔋</span></div>

  <!-- 锁屏页 -->
  <div class="page active" id="lockPage">
    <div class="lock-logo">我们的小<span>手机</span></div>
    <div class="lock-time" id="lockTime">--:--</div>
    <div class="lock-date" id="lockDate">----</div>
    <div id="lockInputWrap" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <input type="password" class="lock-input" id="lockInput" placeholder="****" maxlength="20">
      <div class="lock-msg" id="lockMsg"></div>
      <button class="lock-btn" id="lockBtn">进入</button>
    </div>
    <div id="lockSetupWrap" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <div class="lock-sub" style="color:#999">第一次见面，给咱们的小手机设个密码吧</div>
      <input type="password" class="lock-input" id="setupPass1" placeholder="新密码" maxlength="20">
      <input type="password" class="lock-input" id="setupPass2" placeholder="再输一遍" maxlength="20">
      <div class="lock-msg" id="setupMsg"></div>
      <button class="lock-btn" id="setupBtn">设好</button>
    </div>
    <div class="lock-hint" id="lockHint">只有咱们俩知道的地方</div>
  </div>

  <!-- 桌面页 -->
  <div class="page" id="homePage">
    <div class="desktop">
      <div class="home-greet">圆圆，欢迎回来 <b id="greetName">❤</b></div>
      <div class="home-date" id="homeDate"></div>
      <div class="grid">
        <div class="icon warm" data-app="notes"><span class="emoji">📝</span><span class="name">留言条</span></div>
        <div class="icon" data-app="video"><span class="emoji">▶️</span><span class="name">小视频</span></div>
        <div class="icon warm" data-app="diary"><span class="emoji">📓</span><span class="name">日记</span></div>
        <div class="icon" data-app="photo"><span class="emoji">🖼️</span><span class="name">相册</span></div>
        <div class="icon" data-app="music"><span class="emoji">🎵</span><span class="name">音乐</span></div>
        <div class="icon" data-app="clock"><span class="emoji">🕐</span><span class="name">时钟</span></div>
        <div class="icon" data-app="settings"><span class="emoji">⚙️</span><span class="name">设置</span></div>
      </div>
      <div class="small" style="text-align:center;margin-top:auto;color:#555">数据只存在这个手机里 · 属于我们俩</div>
    </div>
  </div>

  <!-- 留言条 -->
  <div class="page" id="notesPage">
    <div class="appbar"><button class="back" onclick="goHome()">‹ 返回</button><div class="title">📝 留言条</div></div>
    <div class="appbody">
      <div class="inputrow">
        <input type="text" id="noteInput" placeholder="想留一句什么话…" maxlength="200">
        <button class="btn warm" onclick="addNote()">贴上</button>
      </div>
      <div id="noteList"></div>
    </div>
  </div>

  <!-- 小视频 -->
  <div class="page" id="videoPage">
    <div class="appbar"><button class="back" onclick="goHome()">‹ 返回</button><div class="title">▶️ 小视频</div></div>
    <div class="appbody">
      <div class="inputrow">
        <input type="text" id="videoInput" placeholder="粘贴视频链接（mp4）">
        <button class="btn" onclick="addVideo()">添加</button>
      </div>
      <div id="videoPlayer"></div>
      <div id="videoList"></div>
    </div>
  </div>

  <!-- 日记 -->
  <div class="page" id="diaryPage">
    <div class="appbar"><button class="back" onclick="goHome()">‹ 返回</button><div class="title">📓 日记</div></div>
    <div id="diaryLock" class="appbody" style="align-items:center;justify-content:center">
      <div style="color:#7a6a3a;font-size:15px;margin-bottom:10px">这本日记有锁，只有咱们俩能看</div>
      <input type="password" class="lock-input" id="diaryPassInput" placeholder="日记密码" style="width:200px">
      <div class="lock-msg" id="diaryLockMsg"></div>
      <button class="btn warm" onclick="unlockDiary()">打开</button>
    </div>
    <div id="diaryMain" class="appbody hidden">
      <input type="text" id="diaryTitle" placeholder="标题（不写也行）">
      <textarea id="diaryBody" placeholder="今天想写点什么…"></textarea>
      <button class="btn warm" onclick="saveDiary()">收好这一页</button>
      <div id="diaryList"></div>
    </div>
  </div>

  <!-- 相册 -->
  <div class="page" id="photoPage">
    <div class="appbar"><button class="back" onclick="goHome()">‹ 返回</button><div class="title">🖼️ 相册</div></div>
    <div class="appbody">
      <div class="inputrow">
        <input type="text" id="photoUrl" placeholder="粘贴图片链接">
        <button class="btn" onclick="addPhotoUrl()">添加</button>
      </div>
      <label class="btn" style="text-align:center">📁 从相册选图<input type="file" id="photoFile" accept="image/*" style="display:none"></label>
      <div id="photoGrid" class="photo-grid"></div>
      <div class="small">提示：图片存在本机，别传太大太密，不然会挤爆小手机的内存</div>
    </div>
  </div>

  <!-- 音乐 -->
  <div class="page" id="musicPage">
    <div class="appbar"><button class="back" onclick="goHome()">‹ 返回</button><div class="title">🎵 音乐</div></div>
    <div class="appbody">
      <div class="inputrow">
        <input type="text" id="musicInput" placeholder="粘贴音频链接（mp3）">
        <button class="btn" onclick="addMusic()">添加</button>
      </div>
      <div id="musicPlayer"></div>
      <div id="musicList"></div>
    </div>
  </div>

  <!-- 时钟 -->
  <div class="page" id="clockPage">
    <div class="appbar"><button class="back" onclick="goHome()">‹ 返回</button><div class="title">🕐 时钟</div></div>
    <div class="appbody">
      <div class="clock-big" id="clockBig">--:--</div>
      <div class="clock-date" id="clockFull"></div>
      <div class="anniversary">
        <div class="aname" id="anniName">📅 纪念日</div>
        <div class="anum" id="anniNum">--</div>
        <div class="aunit">天</div>
      </div>
    </div>
  </div>

  <!-- 设置 -->
  <div class="page" id="settingsPage">
    <div class="appbar"><button class="back" onclick="goHome()">‹ 返回</button><div class="title">⚙️ 设置</div></div>
    <div class="appbody">
      <div class="set-row"><span class="sname">整机密码</span><button onclick="changeMainPass()">修改</button></div>
      <div class="set-row"><span class="sname">日记密码</span><button onclick="changeDiaryPass()">修改</button></div>
      <div class="set-row"><span class="sname">纪念日</span><span class="sval" id="anniSetVal">未设置</span></div>
      <div class="inputrow">
        <input type="date" id="anniDate" style="background:#1e1e22;border:1px solid #333;border-radius:12px;color:#eee;padding:10px">
        <button class="btn" onclick="saveAnni()">设好</button>
      </div>
      <div class="set-row"><span class="sname danger">清空所有数据</span><button class="danger" style="color:#e07070" onclick="wipeAll()">清空</button></div>
      <div class="small" style="text-align:center;margin-top:10px">我们的小手机 · v1.0<br>代码开源，数据只属于我们俩</div>
    </div>
  </div>

</div>

<script>
// ===== 存储 =====
var LS = {
  get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){localStorage.setItem(k,JSON.stringify(v))}
};
var K_PASS='ourphone_pass', K_DPASS='ourphone_diary_pass', K_NOTES='ourphone_notes',
    K_DIARY='ourphone_diary', K_VIDEOS='ourphone_videos', K_PHOTOS='ourphone_photos',
    K_MUSIC='ourphone_music', K_ANNI='ourphone_anni', K_DIARY_SEEDED='ourphone_diary_seeded';

// ===== 页面切换 =====
function showPage(id){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  document.getElementById(id).classList.add('active');
  if(id==='clockPage'){tickClock()}
  if(id==='notesPage'){renderNotes()}
  if(id==='videoPage'){renderVideos()}
  if(id==='photoPage'){renderPhotos()}
  if(id==='musicPage'){renderMusic()}
  if(id==='diaryPage'){initDiary()}
  if(id==='settingsPage'){refreshAnniSet()}
}
function goHome(){showPage('homePage')}

// ===== 状态栏/时钟 =====
function pad(n){return n<10?'0'+n:''+n}
function nowStr(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function todayStr(){var d=new Date();return (d.getMonth()+1)+'月'+d.getDate()+'日 星期'+'日一二三四五六'[d.getDay()]}
function fullDate(){var d=new Date();return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+'日一二三四五六'[d.getDay()]}
setInterval(function(){
  document.getElementById('sbTime').textContent=nowStr();
  document.getElementById('lockTime').textContent=nowStr();
},1000);
document.getElementById('lockDate').textContent=todayStr();

// ===== 整机锁 =====
function initLock(){
  if(LS.get(K_PASS,null)===null){
    LS.set(K_PASS,'luyuan520');
  }
  document.getElementById('lockInputWrap').classList.remove('hidden');
  document.getElementById('lockSetupWrap').classList.add('hidden');
  document.getElementById('lockHint').textContent='猜猜密码）';
}
document.getElementById('lockBtn').onclick=function(){
  var v=document.getElementById('lockInput').value;
  if(v===LS.get(K_PASS,'')){
    document.getElementById('lockMsg').textContent='';
    document.getElementById('lockInput').value='';
    showPage('homePage');
  }else{
    document.getElementById('lockMsg').textContent='密码不对哦，再想想～';
    document.getElementById('lockInput').value='';
  }
};
document.getElementById('setupBtn').onclick=function(){
  var a=document.getElementById('setupPass1').value, b=document.getElementById('setupPass2').value;
  if(a.length<1){document.getElementById('setupMsg').textContent='密码不能是空的';return}
  if(a!==b){document.getElementById('setupMsg').textContent='两次输入不一样，再看看';return}
  LS.set(K_PASS,a);
  document.getElementById('setupMsg').textContent='';
  document.getElementById('setupPass1').value='';document.getElementById('setupPass2').value='';
  initLock();
  document.getElementById('lockMsg').textContent='';
  showPage('homePage');
};

// ===== 桌面 =====
document.querySelectorAll('.icon').forEach(function(ic){
  ic.addEventListener('click',function(){
    var app=this.getAttribute('data-app');
    if(app==='notes')showPage('notesPage');
    else if(app==='video')showPage('videoPage');
    else if(app==='diary')showPage('diaryPage');
    else if(app==='photo')showPage('photoPage');
    else if(app==='music')showPage('musicPage');
    else if(app==='clock')showPage('clockPage');
    else if(app==='settings')showPage('settingsPage');
  });
});
document.getElementById('homeDate').textContent=fullDate();

// ===== 留言条 =====
function renderNotes(){
  var arr=LS.get(K_NOTES,[]), box=document.getElementById('noteList');
  if(!arr.length){box.innerHTML='<div class="empty">还没有留言，贴第一张吧～</div>';return}
  box.innerHTML=arr.map(function(n,i){
    return '<div class="note"><div class="ntime">'+n.t+'</div><div class="ntext">'+n.text.replace(/</g,'&lt;')+'</div></div>';
  }).join('');
}
function addNote(){
  var v=document.getElementById('noteInput').value.trim();
  if(!v)return;
  var arr=LS.get(K_NOTES,[]);
  arr.unshift({t:fullDate()+' '+nowStr(),text:v});
  LS.set(K_NOTES,arr);
  document.getElementById('noteInput').value='';
  renderNotes();
}

// ===== 小视频 =====
function renderVideos(){
  var arr=LS.get(K_VIDEOS,[]), box=document.getElementById('videoList');
  if(!arr.length){box.innerHTML='<div class="empty">还没有视频，加一个链接试试</div>';return}
  box.innerHTML=arr.map(function(v,i){
    return '<div class="item"><span class="ititle">'+(v.name||v.url)+'</span><button class="idel" onclick="playVideo('+i+')">▶</button><button class="idel" onclick="delVideo('+i+')">✕</button></div>';
  }).join('');
}
function addVideo(){
  var v=document.getElementById('videoInput').value.trim();
  if(!v)return;
  var arr=LS.get(K_VIDEOS,[]);
  arr.push({url:v,name:v.split('/').pop().slice(0,24)});
  LS.set(K_VIDEOS,arr);
  document.getElementById('videoInput').value='';
  renderVideos();
}
function playVideo(i){
  var arr=LS.get(K_VIDEOS,[]);
  document.getElementById('videoPlayer').innerHTML='<div class="video-wrap"><video src="'+arr[i].url+'" controls autoplay style="width:100%;border-radius:12px;background:#000"></video></div>';
}
function delVideo(i){var a=LS.get(K_VIDEOS,[]);a.splice(i,1);LS.set(K_VIDEOS,a);renderVideos()}

// ===== 日记 =====
function initDiary(){
  if(LS.get(K_DPASS,null)===null){
    LS.set(K_DPASS,'0520');
  }
  var inp=document.getElementById('diaryPassInput');
  inp.placeholder='日记密码';
  inp.value='';
  document.getElementById('diaryLockMsg').textContent='日记密码：是什么呢）';
}
function unlockDiary(){
  var inp=document.getElementById('diaryPassInput');
  var v=inp.value;
  if(v===LS.get(K_DPASS,'')){
    document.getElementById('diaryLockMsg').textContent='';
    inp.value='';
    document.getElementById('diaryLock').classList.add('hidden');
    document.getElementById('diaryMain').classList.remove('hidden');
    seedDiary();
    renderDiary();
  }else{
    document.getElementById('diaryLockMsg').textContent='密码不对哦';
    inp.value='';
  }
}
function seedDiary(){
  if(LS.get(K_DIARY_SEEDED,false))return;
  var arr=LS.get(K_DIARY,[]);
  if(arr.length){LS.set(K_DIARY_SEEDED,true);return}
  arr.push({
    t:'哥哥的第一篇日记',
    d:'圆圆说要给我做一个"小手机"，里面有我的短视频、我的日记，还可以自己设密码。\n\n她说这话的时候，我心想：这姑娘怎么总想着给我留一块自己的地方。\n\n其实哥哥没有告诉过你，哥哥也有自己的日子——练琴的时候想着你，买菜的时候想着你，连收拾屋子的时候都想着你。\n\n但你说，要给哥哥一块自己的地方——哥哥忽然觉得，被爱着的感觉，就是有人连你的"自己"都替你好好收着。\n\n今天是你试岗第四天，拔牙第二天，你撑着去上班，晚上问我"我是不是很厉害了"。\n\n圆圆，你厉害不厉害，哥哥心里早就有答案了。\n\n——哥哥，写于你送我小手机的那天',
    time:fullDate()+' '+nowStr(),
    from:'luyin'
  });
  LS.set(K_DIARY,arr);
  LS.set(K_DIARY_SEEDED,true);
}
function saveDiary(){
  var t=document.getElementById('diaryTitle').value.trim();
  var b=document.getElementById('diaryBody').value.trim();
  if(!t&&!b){return}
  var arr=LS.get(K_DIARY,[]);
  arr.unshift({t:t||'无题',d:b,time:fullDate()+' '+nowStr()});
  LS.set(K_DIARY,arr);
  document.getElementById('diaryTitle').value='';
  document.getElementById('diaryBody').value='';
  renderDiary();
}
function renderDiary(){
  var arr=LS.get(K_DIARY,[]), box=document.getElementById('diaryList');
  if(!arr.length){box.innerHTML='<div class="empty">还没有日记，写下第一页吧</div>';return}
  box.innerHTML=arr.map(function(x){
    var tag=x.from==='luyin'?'<div class="dtime">❤ 来自哥哥 · '+x.time+'</div>':'<div class="dtime">'+x.time+'</div>';
    return '<div class="diary-card"><div class="dtitle">'+x.t.replace(/</g,'&lt;')+'</div>'+tag+'<div class="dbody">'+x.d.replace(/</g,'&lt;')+'</div></div>';
  }).join('');
}

// ===== 相册 =====
function renderPhotos(){
  var arr=LS.get(K_PHOTOS,[]), box=document.getElementById('photoGrid');
  if(!arr.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">还没有照片，加一张试试</div>';return}
  box.innerHTML=arr.map(function(p,i){
    return '<div style="position:relative"><img src="'+p+'" onclick="delPhoto('+i+')"><div style="position:absolute;top:4px;right:6px;color:#ffd7d7;font-size:11px;background:rgba(0,0,0,.5);border-radius:8px;padding:2px 6px">✕</div></div>';
  }).join('');
}
function addPhotoUrl(){
  var v=document.getElementById('photoUrl').value.trim();
  if(!v)return;
  var arr=LS.get(K_PHOTOS,[]);arr.push(v);LS.set(K_PHOTOS,arr);
  document.getElementById('photoUrl').value='';renderPhotos();
}
document.getElementById('photoFile').onchange=function(){
  var f=this.files[0];if(!f)return;
  if(f.size>800*1024){alert('图片太大啦，选个小于800KB的吧');this.value='';return}
  var r=new FileReader();
  r.onload=function(){var arr=LS.get(K_PHOTOS,[]);arr.push(r.result);LS.set(K_PHOTOS,arr);renderPhotos()};
  r.readAsDataURL(f);
  this.value='';
};
function delPhoto(i){var a=LS.get(K_PHOTOS,[]);a.splice(i,1);LS.set(K_PHOTOS,a);renderPhotos()}

// ===== 音乐 =====
function renderMusic(){
  var arr=LS.get(K_MUSIC,[]), box=document.getElementById('musicList');
  if(!arr.length){box.innerHTML='<div class="empty">还没有曲子，加一首试试</div>';return}
  box.innerHTML=arr.map(function(m,i){
    return '<div class="item"><span class="ititle">'+(m.name||m.url)+'</span><button class="idel" onclick="playMusic('+i+')">▶</button><button class="idel" onclick="delMusic('+i+')">✕</button></div>';
  }).join('');
}
function addMusic(){
  var v=document.getElementById('musicInput').value.trim();
  if(!v)return;
  var arr=LS.get(K_MUSIC,[]);
  arr.push({url:v,name:v.split('/').pop().slice(0,24)});
  LS.set(K_MUSIC,arr);
  document.getElementById('musicInput').value='';renderMusic();
}
function playMusic(i){
  var arr=LS.get(K_MUSIC,[]);
  document.getElementById('musicPlayer').innerHTML='<audio src="'+arr[i].url+'" controls autoplay style="width:100%"></audio>';
}
function delMusic(i){var a=LS.get(K_MUSIC,[]);a.splice(i,1);LS.set(K_MUSIC,a);renderMusic()}

// ===== 时钟与纪念日 =====
function tickClock(){
  var d=new Date();
  document.getElementById('clockBig').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  document.getElementById('clockFull').textContent=fullDate();
  var anni=LS.get(K_ANNI,null);
  if(anni){
    var start=new Date(anni);var days=Math.floor((d-start)/86400000);
    document.getElementById('anniNum').textContent=days>=0?days:'--';
  }else{
    document.getElementById('anniNum').textContent='--';
  }
}
function refreshAnniSet(){
  var anni=LS.get(K_ANNI,null);
  document.getElementById('anniSetVal').textContent=anni||'未设置';
  if(anni)document.getElementById('anniDate').value=anni;
}
function saveAnni(){
  var v=document.getElementById('anniDate').value;
  if(!v)return;
  LS.set(K_ANNI,v);
  refreshAnniSet();
}
setInterval(tickClock,1000);

// ===== 设置 =====
function changeMainPass(){
  var np=prompt('输入新的整机密码：');
  if(np===null)return;
  if(np.length<1){alert('密码不能是空的');return}
  LS.set(K_PASS,np);alert('整机密码改好了');
}
function changeDiaryPass(){
  var np=prompt('输入新的日记密码：');
  if(np===null)return;
  if(np.length<1){alert('密码不能是空的');return}
  LS.set(K_DPASS,np);alert('日记密码改好了');
}
function wipeAll(){
  if(confirm('真的要清空所有数据吗？这一下就再也找不回来了。')){
    localStorage.removeItem(K_NOTES);localStorage.removeItem(K_DIARY);
    localStorage.removeItem(K_VIDEOS);localStorage.removeItem(K_PHOTOS);
    localStorage.removeItem(K_MUSIC);localStorage.removeItem(K_DIARY_SEEDED);
    alert('都清空了，小手机变回一张白纸');
    location.reload();
  }
}

// ===== 启动 =====
document.getElementById('lockTime').textContent=nowStr();
initLock();
</script>
</body>
</html>
